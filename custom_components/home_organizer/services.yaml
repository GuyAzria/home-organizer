navigate:
  name: Navigate
  description: Change current folder view
  fields:
    direction:
      description: "Direction to move (root, up, down)"
      example: "down"
    name:
      description: "Name of folder to enter"
      example: "Kitchen"

add_item:
  name: Add Item
  description: Create a new item or folder
  fields:
    item_name:
      description: "Name of the item"
      required: true
    item_type:
      description: "Type (item or folder)"
    item_date:
      description: "Date string"
    image_data:
      description: "Base64 image string"
    owner:
      description: "Garment Owner"
    season:
      description: "Clothing Season"
    dress_code:
      description: "Occasion or Style"
    clothing_status:
      description: "Clean, In Laundry, etc"
    measurements:
      description: "JSON string of physical measurements"

update_image:
  name: Update Image
  description: Update item photo
  fields:
    item_name:
      required: true
    image_data:
      required: true

update_stock:
  name: Update Stock
  description: Set absolute stock quantity
  fields:
    item_name:
      required: true
    quantity:
      required: true

update_item_details:
  name: Update Details
  description: Rename or change date
  fields:
    original_name:
      required: true
    new_name:
      required: true
    new_date:
      description: "New date string"
    owner:
      description: "Garment Owner"
    season:
      description: "Clothing Season"
    dress_code:
      description: "Occasion or Style"
    clothing_status:
      description: "Clean, In Laundry, etc"
    measurements:
      description: "JSON string of physical measurements"

update_qty:
  name: Update Quantity
  description: Increment or decrement stock
  fields:
    item_name:
      required: true
    change:
      description: "Amount to change (+1 or -1)"
      required: true

delete_item:
  name: Delete Item
  description: Remove an item or folder
  fields:
    item_name:
      required: true

paste_item:
  name: Paste Item
  description: Move item to current location
  fields:
    target_path:
      description: "List of path segments"

clipboard_action:
  name: Clipboard Action
  description: Cut or Copy
  fields:
    action:
      required: true
    item_name:
      required: true

set_view_context:
  name: Set View Context
  description: Update frontend state variables
  fields:
    path:
      description: "Current path list"
    search_query:
      description: "Search term"
    date_filter:
      description: "Filter mode"
    shopping_mode:
      description: "Boolean for shopping view"

ai_action:
  name: AI Action
  description: Process image with Gemini
  fields:
    mode:
      description: "identify or search"
    image_data:
      description: "Base64 image"

trigger_search:
  name: Trigger Search
  description: Internal search trigger
  fields: {}

# [ADDED v2026.10.5] Services that were registered in code but never
# listed here. hassfest validates services.yaml against strings.json, so
# an undocumented service fails the action.

add_category:
  # Add a category or sub-category to the list.

clear_all_data:
  # Delete every item, location and setting.

clear_all_items:
  # Delete every item, keeping locations and settings.

clear_barcode_history:
  # Forget all remembered barcode lookups.

confirm_pending:
  # Approve a scanned item and add it to the inventory.

delete_receipt:
  # Permanently delete a receipt, its images and its price history.

delete_scan:
  # Discard an unreviewed scan with its items and images.

duplicate_item:
  # Create a copy of an item in the same location.

rename_category:
  # Rename a category or sub-category and move its items.

set_receipt_currency:
  # Correct the currency recorded on a receipt.

update_item_extras:
  # Set the purchase price, expiry date or warranty end date of an item.

update_order_qty:
  # Change how many of an item to buy.