# Shared lint configuration. Both `ruff check` locally and the GitHub Action
# read this file, so CI and your machine can never disagree.

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Defect-oriented rules only. E9 = syntax/runtime errors, F = pyflakes
# (undefined names, unused imports), B = bugbear (real bug patterns).
# UP and SIM are modernisation and style; they produce noise on a mature
# codebase without finding defects, so they are deliberately not selected.
select = ["E9", "F", "B"]
ignore = [
    "E501",  # line length - enforced by review, not by the linter
]

[tool.ruff.lint.per-file-ignores]
# B023 warns that a closure references a loop variable. That is a real bug
# only when the closure outlives the iteration. Here every one of these is
# defined and awaited inside the same iteration (see db_process_item, defined
# at 416 and awaited at 438), so the value is always correct. Verified by
# reading each site; revisit if any of these are ever scheduled as a task.
"custom_components/home_organizer/agents/shopping_agent.py" = ["B023"]

[tool.bandit]
# B608: SQL built with f-strings. Every fragment in this project is
#       f"level_{i}" where i is an integer loop counter; all values go
#       through ? placeholders. Reviewed individually - no user input
#       reaches query structure. Re-review if query building changes.
# B110: try/except/pass. Checked that there are no bare `except:` clauses,
#       so asyncio.CancelledError is never swallowed.
skips = ["B608", "B110"]
exclude_dirs = ["tests", ".git"]
